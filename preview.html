<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>F050 产测方案画册 - 预览</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f6f7; color: #1f2329;
}
.app { height: 100vh; display: flex; flex-direction: column; background: #f5f6f7; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #e3e8ef; background: #fff; }
.h-title { font-size: 15px; font-weight: 600; }
.h-actions { display: flex; gap: 8px; }
.btn { font-size: 12px; padding: 5px 12px; border: 1px solid #c9d4e3; border-radius: 6px; background: #fff; color: #1f2329; cursor: pointer; }
.btn:hover { border-color: #378add; color: #185fa5; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: #185fa5; border-color: #185fa5; color: #fff; }
.btn-primary:hover { background: #0c447c; color: #fff; }
.t-msg { font-size: 12px; color: #5f5e5a; padding: 6px 16px; background: #fff; border-bottom: 1px solid #eef1f5; }
.album { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; align-content: start; }
.card { position: relative; background: #fff; border: 1px solid #e5e6e8; border-radius: 8px; overflow: hidden; cursor: grab; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, opacity .15s ease; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.10); border-color: #c9d4e3; }
.card:active { cursor: grabbing; transform: translateY(-1px) scale(.98); box-shadow: 0 3px 10px rgba(0,0,0,.10); }
.card.dragging { opacity: .45; transform: none; border-style: dashed; border-color: #378add; }
.card.drag-over { outline: 2px solid #378add; outline-offset: -2px; }
.card-link { display: block; text-decoration: none; color: inherit; }
.card-cover { position: relative; height: 110px; display: flex; align-items: center; justify-content: center; }
.card-icon { filter: drop-shadow(0 1px 2px rgba(0,0,0,.15)); }
.card-type { position: absolute; bottom: 8px; left: 10px; font-size: 11px; color: rgba(255,255,255,.95); background: rgba(0,0,0,.18); padding: 2px 8px; border-radius: 10px; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-open { position: absolute; bottom: 8px; right: 10px; font-size: 14px; color: rgba(255,255,255,.95); opacity: 0; transform: translate(2px,-2px); transition: opacity .15s, transform .15s; }
.card:hover .card-open { opacity: 1; transform: translate(0,0); }
.card-body { padding: 10px 12px 12px; border-top: 1px solid #f0f2f5; }
.card-title { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.card-meta { margin-top: 6px; font-size: 11px; color: #b4b2a9; }
.card-del { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s; z-index: 2; }
.card:hover .card-del { opacity: 1; }
.card-del:hover { background: #d9433f; }
.add-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.add-panel { width: 320px; background: #fff; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.add-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.add-panel label { font-size: 12px; color: #5f5e5a; }
.add-panel input { font-size: 13px; padding: 7px 8px; border: 1px solid #c9d4e3; border-radius: 6px; outline: none; }
.add-panel input:focus { border-color: #378add; }
.add-hint { font-size: 11px; color: #b4b2a9; margin-top: 2px; }
.add-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="h-title">F050 产测方案画册</span>
    <div class="h-actions">
      <button class="btn btn-primary" onclick="openAdd()">＋ 添加卡片</button>
    </div>
  </div>
  <div class="t-msg" id="msg">预览模式：可拖动卡片排序、添加卡片（自动抓标题 / 飞书手填）、删除、点击跳转</div>
  <div class="album" id="album"></div>
</div>

<div class="add-mask" id="mask" style="display:none" onclick="closeAdd()">
  <div class="add-panel" onclick="event.stopPropagation()">
    <div class="add-title">添加产测方案卡片</div>
    <label>产测方案链接（必填）</label>
    <input id="url" placeholder="https://…" onkeydown="if(event.key==='Enter')doAdd()" />
    <div id="nameWrap" style="display:none">
      <label>文档名称（用于卡片显示）</label>
      <input id="name" placeholder="请输入文档名称" onkeydown="if(event.key==='Enter')doAdd()" />
    </div>
    <div class="add-hint" id="hint">填链接后点「添加」：网页链接自动抓标题；飞书文档需手动填名称</div>
    <div class="add-btns">
      <button class="btn" onclick="closeAdd()">取消</button>
      <button class="btn btn-primary" id="addBtn" onclick="doAdd()">添加</button>
    </div>
  </div>
</div>

<script>
const GRADS = [['#185FA5','#4A9BD9'],['#0C447C','#2E7CB8'],['#1D6FB8','#5BA6DE'],['#534AB7','#8A82E0'],['#0E7C86','#3AA8B2']];
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];
const DOC_ICON = '<svg class="card-icon" viewBox="0 0 24 24" width="34" height="34"><path d="M7 2.5h7.2l4.3 4.3V21.5H7V2.5z" fill="rgba(255,255,255,0.30)"/><path d="M14 2.5v4.5h4.5" fill="rgba(255,255,255,0.45)"/><rect x="9.2" y="11" width="5.6" height="1.5" rx="0.75" fill="#fff"/><rect x="9.2" y="14" width="5.6" height="1.5" rx="0.75" fill="#fff"/><rect x="9.2" y="17" width="3.4" height="1.5" rx="0.75" fill="#fff"/></svg>';
let cards = [
  { id:'c1', name:'F050 整机自检产测方案', url:'https://gcmomk3i2c.feishu.cn/docx/AbCdEf123456', addedAt: Date.now()-3600000 },
  { id:'c2', name:'F050 XY 轴定位精度测试方案', url:'https://example.com/xy', addedAt: Date.now()-86400000 },
  { id:'c3', name:'F050 四色换色功能测试方案', url:'https://gcmomk3i2c.feishu.cn/wiki/space/123', addedAt: Date.now()-172800000 },
];
const isFeishu = u => { try { return /(feishu\.cn|larksuite\.com)$/.test(new URL(u).hostname); } catch(e){ return false; } };
const sourceType = u => {
  try {
    const x = new URL(u), h = x.hostname;
    if (/feishu\.cn$/.test(h) || /larksuite\.com$/.test(h)) {
      if (/\/wiki\//.test(x.pathname)) return '飞书知识库';
      if (/\/docx\//.test(x.pathname)) return '飞书文档';
      if (/\/(sheet|sheets|base)\//.test(x.pathname)) return '飞书表格';
      if (/\/mindnotes\//.test(x.pathname)) return '飞书思维笔记';
      return '飞书';
    }
    return '网页链接';
  } catch(e){ return '网页链接'; }
};
const fmtTime = ts => {
  if(!ts) return '';
  const d = new Date(ts), n = new Date(), p = x => String(x).padStart(2,'0');
  const mmdd = p(d.getMonth()+1)+'-'+p(d.getDate());
  if(d.getFullYear()===n.getFullYear()) return mmdd+' '+p(d.getHours())+':'+p(d.getMinutes());
  return d.getFullYear()+'-'+mmdd;
};
const colorIndex = id => { let h = 0; for (let i = 0; i < id.length; i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return h % GRADS.length; };
// 拖拽排序（预览用 drop 式重排）
let dragIdx = null, overIdx = null;
function pDragStart(e, idx){
  dragIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(idx)); } catch(_){}
  e.currentTarget.classList.add('dragging');
}
function pDragOver(e, idx){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  overIdx = idx;
  document.querySelectorAll('.card').forEach((c,k)=>c.classList.toggle('drag-over', k===idx && dragIdx!==idx));
}
function pDragEnd(){
  dragIdx = null; overIdx = null;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('dragging','drag-over'));
}
function pDrop(e){
  e.preventDefault();
  if(dragIdx!=null && overIdx!=null && dragIdx!==overIdx){
    const next = [...cards];
    const [m] = next.splice(dragIdx,1);
    next.splice(overIdx,0,m);
    cards = next;
  }
  pDragEnd();
  render();
  msg('已调整顺序（拖到目标卡片上松开即可）');
}
function msg(t){ document.getElementById('msg').textContent = t; }
function render(){
  const a = document.getElementById('album');
  a.innerHTML = cards.map((c,i)=>{
    const [g0,g1] = GRADS[colorIndex(c.id)];
    return '<div class="card" draggable="true" ondragstart="pDragStart(event,'+i+')" ondragover="pDragOver(event,'+i+')" ondrop="pDrop(event)" ondragend="pDragEnd()">'
      + '<a class="card-link" href="'+c.url+'" target="_blank" rel="noopener noreferrer" title="打开：'+escapeHtml(c.name)+'">'
      + '<div class="card-cover" style="background:linear-gradient(135deg,'+g0+','+g1+')">'+DOC_ICON
      + '<span class="card-type">'+sourceType(c.url)+'</span><span class="card-open">↗</span></div>'
      + '<div class="card-body"><div class="card-title">'+escapeHtml(c.name)+'</div><div class="card-meta">添加于 '+fmtTime(c.addedAt)+'</div></div></a>'
      + '<button class="card-del" title="删除" draggable="false" ondragstart="event.preventDefault();event.stopPropagation()" onclick="del(\''+c.id+'\')">×</button></div>';
  }).join('');
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function openAdd(){ document.getElementById('mask').style.display='flex'; document.getElementById('url').value=''; document.getElementById('nameWrap').style.display='none'; document.getElementById('name').value=''; document.getElementById('hint').textContent='填链接后点「添加」：网页链接自动抓标题；飞书文档需手动填名称'; document.getElementById('addBtn').disabled=false; document.getElementById('addBtn').textContent='添加'; setTimeout(()=>document.getElementById('url').focus(),50); }
function closeAdd(){ document.getElementById('mask').style.display='none'; }
function del(id){ cards = cards.filter(c=>c.id!==id); render(); msg('已删除卡片'); }
async function fetchTitle(url){
  const attempts = [{url}, ...PROXIES.map(p=>({url:p(url)}))];
  for(const a of attempts){
    try {
      const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 8000);
      const res = await fetch(a.url, {signal:ctrl.signal, redirect:'follow'}); clearTimeout(t);
      if(!res.ok) continue;
      const text = await res.text();
      const m = text.match(/<title[^>]*>([^<]*)<\/title>/i);
      if(m && m[1] && m[1].trim()) return m[1].trim();
    } catch(e){}
  }
  return null;
}
async function doAdd(){
  const url = document.getElementById('url').value.trim();
  if(!/^https?:\/\//i.test(url)){ msg('请输入有效的 http(s) 链接'); return; }
  const name = document.getElementById('name').value.trim();
  if(name){ commit(name, url); return; }
  if(isFeishu(url)){ showName('飞书文档链接需登录鉴权，无法自动读取标题，请手动填写文档名称'); return; }
  document.getElementById('addBtn').disabled = true; document.getElementById('addBtn').textContent='抓取中…';
  document.getElementById('hint').textContent='正在抓取页面标题…';
  const title = await fetchTitle(url);
  if(title){ commit(title, url); }
  else { showName('无法自动获取标题，请手动填写文档名称'); }
}
function showName(hintText){
  document.getElementById('nameWrap').style.display='block';
  document.getElementById('hint').textContent = hintText;
  document.getElementById('addBtn').disabled=false; document.getElementById('addBtn').textContent='确认添加';
  document.getElementById('name').focus();
}
function commit(name, url){
  cards.push({ id:'c'+Date.now(), name, url, addedAt: Date.now() });
  render(); closeAdd(); msg('已添加「'+name+'」');
}
render();
</script>
</body>
</html>
